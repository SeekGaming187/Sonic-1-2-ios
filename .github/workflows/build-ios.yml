name: Build Sonic 1 & 2 iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout SDL2
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-2.30.10
          path: SDL

      - name: Checkout libogg
        uses: actions/checkout@v4
        with:
          repository: xiph/ogg
          ref: v1.3.5
          path: ogg

      - name: Checkout libvorbis
        uses: actions/checkout@v4
        with:
          repository: xiph/vorbis
          ref: v1.3.7
          path: vorbis

      - name: Create iOS CMake Toolchain
        run: |
          cat << 'EOF' > ios.toolchain.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_OSX_ARCHITECTURES arm64)
          set(CMAKE_OSX_DEPLOYMENT_TARGET 13.0)
          set(CMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH NO)
          set(CMAKE_IOS_INSTALL_COMBINED NO)
          EOF
          
      - name: Build SDL2, libogg, and libvorbis for iOS
        run: |
          mkdir -p ios-deps/include/SDL2 ios-deps/include/ogg ios-deps/lib

          # 1. SDL2
          cmake -S SDL -B SDL/build -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/ios.toolchain.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF
          cmake --build SDL/build --config Release --parallel 4 -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          cp SDL/include/*.h ios-deps/include/SDL2/
          find SDL/build -name "libSDL2*.a" -exec cp {} ios-deps/lib/libSDL2.a \;

          # 2. libogg (manual copy to avoid Xcode Release-iphoneos install path quirks)
          cmake -S ogg -B ogg/build -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/ios.toolchain.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build ogg/build --config Release --parallel 4 -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          cp ogg/include/ogg/*.h ios-deps/include/ogg/
          cp ogg/build/include/ogg/*.h ios-deps/include/ogg/ 2>/dev/null || true
          find ogg/build -name "libogg.a" -exec cp {} ios-deps/lib/libogg.a \;

          # 3. libvorbis (explicitly pass OGG_INCLUDE_DIR and OGG_LIBRARY)
          cmake -S vorbis -B vorbis/build -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/ios.toolchain.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOGG_INCLUDE_DIR="$PWD/ios-deps/include" \
            -DOGG_LIBRARY="$PWD/ios-deps/lib/libogg.a"
          cmake --build vorbis/build --config Release --parallel 4 -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          cp -r vorbis/include/vorbis ios-deps/include/
          find vorbis/build -name "libvorbis.a" -exec cp {} ios-deps/lib/libvorbis.a \;
          find vorbis/build -name "libvorbisfile.a" -exec cp {} ios-deps/lib/libvorbisfile.a \;


      - name: Compile RSDKv4 Engine & Package IPA
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/RSDKv4.app build_objs

          CPP_FILES=$(find RSDKv4 -name "*.cpp")
          C_FILES=$(find RSDKv4 -name "*.c")

          OBJ_FILES=""
          for f in $C_FILES; do
            obj="build_objs/$(echo $f | tr '/' '_').o"
            xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=13.0 \
              -O2 -DRETRO_USE_HW_RENDER=1 -DRETRO_USING_SDL2=1 \
              -I"$PWD/RSDKv4" -I"$PWD/ios-deps/include" \
              -c "$f" -o "$obj"
            OBJ_FILES="$OBJ_FILES $obj"
          done

          for f in $CPP_FILES; do
            obj="build_objs/$(echo $f | tr '/' '_').o"
            xcrun --sdk iphoneos clang++ -std=c++17 -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=13.0 \
              -O2 -DRETRO_USE_HW_RENDER=1 -DRETRO_USING_SDL2=1 \
              -I"$PWD/RSDKv4" -I"$PWD/ios-deps/include" \
              -c "$f" -o "$obj"
            OBJ_FILES="$OBJ_FILES $obj"
          done

          xcrun --sdk iphoneos clang++ -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=13.0 \
            $OBJ_FILES \
            -L"$PWD/ios-deps/lib" -lSDL2 -lvorbisfile -lvorbis -logg -lz \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -framework OpenGLES -framework AudioToolbox -framework CoreAudio -framework AVFoundation \
            -framework GameController -framework CoreMotion -framework CoreHaptics -framework Metal \
            -o Payload/RSDKv4.app/RSDKv4

          cp dependencies/ios/Info.plist Payload/RSDKv4.app/Info.plist || true
          cp -r dependencies/ios/Assets.xcassets/* Payload/RSDKv4.app/ 2>/dev/null || true

          zip -r SonicForeverAbsolute.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicForeverAbsolute-iOS
          path: SonicForeverAbsolute.ipa
