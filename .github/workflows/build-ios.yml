name: Build Sonic 1 & 2 iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create placeholder Data.rsdk for Xcode
        run: |
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk

      - name: Build iOS App
        run: |
          xcodebuild \
            -project "RSDKv4 ios.xcodeproj" \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into unsigned IPA
        run: |
          rm -f build/RSDKv4.app/Data.rsdk
          mkdir -p Payload
          cp -r build/RSDKv4.app Payload/
          zip -r SonicForeverAbsolute.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicForeverAbsolute-iOS
          path: SonicForeverAbsolute.ipa
